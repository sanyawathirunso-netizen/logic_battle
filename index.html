<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมประลองตรรกศาสตร์ (Online Mode)</title>
    <!-- โหลด Firebase SDK จาก CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            background: #252525;
            border: 2px solid #4caf50;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(76,175,80,0.3);
            box-sizing: border-box;
        }
        input, select, button {
            padding: 10px;
            font-size: 15px;
            width: 90%;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            margin: 8px 0;
            text-align: center;
        }
        .btn-action { background-color: #4caf50; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-action:hover { background-color: #45a049; }
        
        #gameArea { display: none; width: 100%; max-width: 450px; }
        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 6px;
            border-left: 5px solid #00bcd4;
        }
        .color-badge {
            width: 25px; height: 25px; border-radius: 50%; display: inline-block; border: 2px solid #fff;
        }
        #scoreboard {
            background: rgba(37, 37, 37, 0.9);
            border: 2px solid #4caf50;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }
        #scoreboard h4 { margin: 0 0 8px 0; color: #ffeb3b; text-align: center; border-bottom: 1px solid #555; padding-bottom: 4px; }
        #scoreList { list-style: none; padding: 0; margin: 0; }
        #scoreList li { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
        
        #battleOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 999; text-align: center; padding: 15px; box-sizing: border-box;
        }
        .battle-box {
            background: #252525; border: 2px solid #ff9800; padding: 25px; border-radius: 12px; max-width: 380px; width: 100%; box-shadow: 0 0 25px rgba(255, 152, 0, 0.4);
        }
        .btn-battle { background-color: #ff9800; font-weight: bold; cursor: pointer; color: #000; border: none; }
    </style>
</head>
<body>

    <!-- หน้า login เข้าห้อง -->
    <div id="loginOverlay" class="container">
        <h2 style="color: #4caf50; margin-top:0;">📊 ประลองตรรกศาสตร์ (Online)</h2>
        <input type="text" id="usernameInput" placeholder="ชื่อผู้เล่น..." maxlength="12">
        <input type="text" id="roomCodeInput" placeholder="รหัสห้อง 4 หลัก..." maxlength="4">
        <br>
        <button onclick="joinGame()" class="btn-action">เข้าสู่ห้องประลอง</button>
        <p id="statusMsg" style="font-size: 12px; color: #ffeb3b; margin-top: 8px;"></p>
    </div>

    <!-- หน้าหลักเกม (Lobby) -->
    <div id="gameArea">
        <div class="container" style="max-width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span>👤 <strong id="barId" style="color:#4caf50;">-</strong></span>
                <span>🏠 ห้อง: <strong id="displayRoomId" style="color:#ffeb3b;">-</strong></span>
                <span id="myColorBox" class="color-badge"></span>
            </div>

            <div id="scoreboard">
                <h4>🏆 ตารางคะแนนรวม</h4>
                <ul id="scoreList"></ul>
            </div>

            <h3 style="color: #00bcd4; margin: 10px 0 5px 0; font-size: 16px;">👥 รายชื่อผู้เล่นในห้อง (คลิกเพื่อสร้างโจทย์ท้าดวล)</h3>
            <div id="playerListContainer" style="max-height: 200px; overflow-y: auto;">
                <p style="color: #888; font-size: 13px;">กำลังโหลดรายชื่อผู้เล่น...</p>
            </div>
        </div>
    </div>

    <!-- หน้าต่างสร้างโจทย์และตอบโจทย์ -->
    <div id="battleOverlay">
        <div class="battle-box">
            <h3 id="battleTitle" style="color: #ff9800; margin-top:0;">📝 สร้างโจทย์ตรรกศาสตร์</h3>
            
            <!-- ส่วนที่ 1: หน้าจอสร้างโจทย์ (ผู้ท้าดวลเป็นคนตั้ง) -->
            <div id="creatorSection">
                <p id="targetPlayerLabel" style="font-size: 13px; color: #ccc; margin-bottom: 10px;"></p>
                <div style="text-align: left; margin: 0 auto; width: 90%;">
                    <label style="font-size: 13px; color: #00bcd4;">ค่า P:</label>
                    <select id="selectP">
                        <option value="true">T (จริง)</option>
                        <option value="false">F (เท็จ)</option>
                    </select>
                    
                    <label style="font-size: 13px; color: #00bcd4;">ตัวเชื่อม:</label>
                    <select id="selectConnector">
                        <option value="AND">∧ (และ)</option>
                        <option value="OR">∨ (หรือ)</option>
                        <option value="IF">→ (ถ้า...แล้ว...)</option>
                        <option value="IFF">↔ (ก็ต่อเมื่อ)</option>
                    </select>

                    <label style="font-size: 13px; color: #00bcd4;">ค่า Q:</label>
                    <select id="selectQ">
                        <option value="true">T (จริง)</option>
                        <option value="false">F (เท็จ)</option>
                    </select>
                </div>
                <button onclick="sendQuizToTarget()" class="btn-battle" style="margin-top: 15px; padding: 10px; width: 90%;">ส่งโจทย์ให้เพื่อนตอบ 🚀</button>
                <button onclick="endBattle()" style="background: #555; margin-top: 5px; border:none; padding:8px; width: 90%; border-radius:6px; cursor:pointer; color:white;">ยกเลิก</button>
            </div>

            <!-- ส่วนที่ 2: หน้าจอรอเพื่อนตอบ หรือหน้าจอให้เป้าหมายตอบโจทย์ -->
            <div id="responderSection" style="display: none;">
                <p id="battleDesc" style="font-size: 14px; color: #ccc;"></p>
                <p id="quizQuestion" style="font-size: 18px; color: #ffeb3b; font-weight: bold; margin: 15px 0;"></p>
                
                <div id="answerButtons">
                    <button onclick="answerQuiz(true)" style="background-color: #4caf50; width: 45%; font-size: 16px; cursor:pointer; border:none; padding:12px; border-radius:6px; color:white; font-weight:bold;">T (True)</button>
                    <button onclick="answerQuiz(false)" style="background-color: #f44336; width: 45%; font-size: 16px; cursor:pointer; border:none; padding:12px; border-radius:6px; color:white; font-weight:bold; margin-left: 5px;">F (False)</button>
                </div>
                
                <button id="closeBattleBtn" onclick="endBattle()" class="btn-action" style="display:none; margin-top: 15px;">กลับสู่หน้าหลัก</button>
            </div>
        </div>
    </div>

    <script>
        // ตั้งค่า Firebase สาธารณะสำหรับทดสอบระบบ
        const firebaseConfig = {
            databaseURL: "https://logic-game-test-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = '', roomId = '', myScore = 0;
        let myColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        let players = {};
        let currentTarget = '';
        let activeQuiz = null;
        let incomingQuizData = null;
        let isBattling = false;
        let answeredCurrentQuiz = false;
        let myPlayerRef = null;

        function joinGame() {
            myId = document.getElementById('usernameInput').value.trim();
            roomId = document.getElementById('roomCodeInput').value.trim();

            if (!myId || roomId.length !== 4) {
                alert('กรุณากรอกชื่อและรหัสห้อง 4 หลักให้ถูกต้อง');
                return;
            }

            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('barId').innerText = myId;
            document.getElementById('displayRoomId').innerText = roomId;
            document.getElementById('myColorBox').style.backgroundColor = myColor;

            // อ้างอิงตำแหน่งข้อมูลผู้เล่นคนนี้ใน Firebase ตามรหัสห้อง
            myPlayerRef = db.ref('rooms/' + roomId + '/players/' + myId);
            
            // ลบข้อมูลตัวเองออกเมื่อปิดหน้าเว็บ
            myPlayerRef.onDisconnect().remove();

            // ส่งข้อมูลอัปเดตสถานะแรกเริ่ม
            updateMyDataToFirebase();

            // ฟังการเปลี่ยนแปลงของห้องทั้งหมดแบบ Realtime
            db.ref('rooms/' + roomId + '/players').on('value', (snapshot) => {
                let data = snapshot.val() || {};
                players = data;
                updateLobbyUI();
                checkForIncomingQuiz();
            });
        }

        function updateMyDataToFirebase() {
            if (!myPlayerRef) return;
            myPlayerRef.set({
                score: myScore,
                color: myColor,
                target: currentTarget,
                quiz: activeQuiz || null
            });
        }

        function updateLobbyUI() {
            let list = [];
            for (let id in players) {
                list.push({ id, score: players[id].score });
            }
            list.sort((a, b) => b.score - a.score);

            let scoreHtml = '';
            list.forEach(p => {
                let bold = (p.id === myId) ? 'color: #4caf50; font-weight:bold;' : 'color: #fff;';
                scoreHtml += `<li style="${bold}"><span>${p.id}</span> <span>⭐ ${p.score} คะแนน</span></li>`;
            });
            document.getElementById('scoreList').innerHTML = scoreHtml;

            let playerHtml = '';
            for (let id in players) {
                if (id !== myId) {
                    let pInfo = players[id];
                    playerHtml += `
                        <div class="player-card">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="color-badge" style="background-color: ${pInfo.color};"></span>
                                <span style="font-weight: bold;">${id}</span>
                            </div>
                            <button onclick="openCreatorModal('${id}')" class="btn-battle" style="width: auto; padding: 6px 12px; font-size: 13px;">สร้างโจทย์ท้าดวล ⚔️</button>
                        </div>
                    `;
                }
            }
            document.getElementById('playerListContainer').innerHTML = playerHtml || '<p style="color: #888; font-size: 13px;">ยังไม่มีผู้เล่นอื่นในห้องนี้</p>';
        }

        function openCreatorModal(targetId) {
            currentTarget = targetId;
            isBattling = true;
            answeredCurrentQuiz = false;
            document.getElementById('battleOverlay').style.display = 'flex';
            document.getElementById('battleTitle').innerText = `📝 สร้างโจทย์ให้ ${targetId}`;
            document.getElementById('targetPlayerLabel').innerText = `คุณกำลังสร้างโจทย์ท้าดวล ${targetId}`;
            document.getElementById('creatorSection').style.display = 'block';
            document.getElementById('responderSection').style.display = 'none';
        }

        function sendQuizToTarget() {
            let pVal = document.getElementById('selectP').value === 'true';
            let qVal = document.getElementById('selectQ').value === 'true';
            let conn = document.getElementById('selectConnector').value;

            let symbol = '';
            let truth = false;

            if (conn === 'AND') { symbol = '∧ (และ)'; truth = pVal && qVal; }
            else if (conn === 'OR') { symbol = '∨ (หรือ)'; truth = pVal || qVal; }
            else if (conn === 'IF') { symbol = '→ (ถ้า...แล้ว...)'; truth = !pVal || qVal; }
            else if (conn === 'IFF') { symbol = '↔ (ก็ต่อเมื่อ)'; truth = pVal === qVal; }

            activeQuiz = {
                creator: myId,
                target: currentTarget,
                pVal, qVal, symbol, truth
            };

            document.getElementById('creatorSection').style.display = 'none';
            document.getElementById('responderSection').style.display = 'block';
            document.getElementById('battleTitle').innerText = '⏳ ส่งโจทย์เรียบร้อย';
            document.getElementById('battleDesc').innerText = `กำลังรอให้ ${currentTarget} ตอบโจทย์ของคุณ...`;
            document.getElementById('quizQuestion').innerText = `โจทย์ที่ส่ง:\nP = ${pVal?'T':'F'}, Q = ${qVal?'T':'F'} [ P ${symbol} Q ]`;
            document.getElementById('answerButtons').style.display = 'none';
            document.getElementById('closeBattleBtn').style.display = 'block';

            updateMyDataToFirebase();
        }

        function checkForIncomingQuiz() {
            if (isBattling && incomingQuizData) return;

            // ตรวจสอบว่ามีผู้เล่นคนอื่นตั้ง target เป็นเรา และมี quiz ส่งมา
            for (let id in players) {
                let p = players[id];
                if (p.target === myId && p.quiz && !incomingQuizData) {
                    incomingQuizData = p.quiz;
                    isBattling = true;
                    answeredCurrentQuiz = false;
                    
                    document.getElementById('battleOverlay').style.display = 'flex';
                    document.getElementById('battleTitle').innerText = `🎯 มีโจทย์จาก ${id}!`;
                    document.getElementById('creatorSection').style.display = 'none';
                    document.getElementById('responderSection').style.display = 'block';
                    document.getElementById('battleDesc').innerText = `ผู้ท้าชิง ${id} ส่งโจทย์ข้อนี้มาให้คุณตอบ:`;
                    
                    let pStr = incomingQuizData.pVal ? 'T' : 'F';
                    let qStr = incomingQuizData.qVal ? 'T' : 'F';
                    document.getElementById('quizQuestion').innerText = `กำหนดให้ P = ${pStr}, Q = ${qStr}\nค่าความจริงของ [ P ${incomingQuizData.symbol} Q ] คืออะไร?`;
                    
                    document.getElementById('answerButtons').style.display = 'block';
                    document.getElementById('closeBattleBtn').style.display = 'none';
                    break;
                }
            }
        }

        function answerQuiz(userAnswer) {
            if (answeredCurrentQuiz) return;
            answeredCurrentQuiz = true;

            document.getElementById('answerButtons').style.display = 'none';
            document.getElementById('closeBattleBtn').style.display = 'block';

            let correctAns = incomingQuizData ? incomingQuizData.truth : (activeQuiz ? activeQuiz.truth : false);

            if (userAnswer === correctAns) {
                myScore += 10;
                document.getElementById('battleDesc').innerHTML = '<span style="color: #4caf50; font-size: 18px; font-weight: bold;">🎉 ถูกต้อง! คุณได้รับ +10 คะแนน</span>';
            } else {
                document.getElementById('battleDesc').innerHTML = '<span style="color: #f44336; font-size: 18px; font-weight: bold;">❌ ผิดครับ! น่าเสียดาย</span>';
            }
            updateMyDataToFirebase();
        }

        function endBattle() {
            isBattling = false;
            currentTarget = '';
            activeQuiz = null;
            incomingQuizData = null;
            answeredCurrentQuiz = false;
            document.getElementById('battleOverlay').style.display = 'none';
            updateMyDataToFirebase();
        }
    </script>
</body>
</html>
