<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมตรรกศาสตร์ Google Sheets Sync</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-box {
            background: #252525;
            border: 2px solid #4caf50;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 0 20px rgba(76,175,80,0.3);
        }
        .login-box input, .login-box select {
            padding: 10px;
            font-size: 15px;
            width: 90%;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            margin: 8px 0;
            text-align: center;
        }
        #scoreboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(37, 37, 37, 0.9);
            border: 2px solid #4caf50;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            min-width: 150px;
            z-index: 5;
        }
        #scoreboard h4 {
            margin: 0 0 4px 0;
            color: #ffeb3b;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid #555;
            padding-bottom: 2px;
        }
        #scoreList { list-style: none; padding: 0; margin: 0; }
        #scoreList li { display: flex; justify-content: space-between; margin: 2px 0; }
        #myInfoBar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(37, 37, 37, 0.9);
            border: 2px solid #4caf50;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #4caf50;
            z-index: 5;
        }
        #gameContainer { position: relative; margin-top: 50px; display: none; text-align: center; }
        canvas { border: 3px solid #4caf50; background-color: #1e1e1e; box-shadow: 0 0 20px rgba(76, 175, 80, 0.4); max-width: 100%; height: auto; }
        .info { margin-bottom: 8px; font-size: 12px; color: #4caf50; }
        #mobileControls {
            display: none;
            margin-top: 10px;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 5px;
            justify-content: center;
        }
        .d-btn {
            background: #333; color: #4caf50; border: 2px solid #4caf50;
            font-size: 20px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        .d-btn:active { background: #4caf50; color: #121212; }
        .btn-action { background-color: #4caf50; color: white; font-weight: bold; cursor: pointer; width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 15px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: #4caf50; margin-top:0;">📊 เกมตรรกศาสตร์ Sheets</h2>
            <input type="text" id="usernameInput" placeholder="ชื่อผู้เล่น..." maxlength="12">
            <input type="text" id="roomCodeInput" placeholder="รหัสห้อง 4 หลัก..." maxlength="4">
            <br><br>
            <button onclick="joinGame()" class="btn-action">เข้าสู่เกม</button>
            <p id="statusMsg" style="font-size: 11px; color: #ffeb3b; margin-top: 8px;"></p>
        </div>
    </div>

    <div id="myInfoBar">
        👤 <span id="barId">-</span> | 🏠 ห้อง: <span id="displayRoomId" style="color:#4caf50;">-</span>
    </div>

    <div id="scoreboard">
        <h4>🏆 ตารางคะแนน</h4>
        <ul id="scoreList"></ul>
    </div>

    <div id="gameContainer">
        <div class="info">ใช้ปุ่มลูกศรเพื่อเคลื่อนที่</div>
        <canvas id="gameCanvas" width="550" height="350"></canvas>
        <div id="mobileControls">
            <div></div>
            <button class="d-btn" ontouchstart="setKey('ArrowUp', true)" ontouchend="setKey('ArrowUp', false)" onmousedown="setKey('ArrowUp', true)" onmouseup="setKey('ArrowUp', false)">⬆️</button>
            <div></div>
            <button class="d-btn" ontouchstart="setKey('ArrowLeft', true)" ontouchend="setKey('ArrowLeft', false)" onmousedown="setKey('ArrowLeft', true)" onmouseup="setKey('ArrowLeft', false)">⬅️</button>
            <button class="d-btn" ontouchstart="setKey('ArrowDown', true)" ontouchend="setKey('ArrowDown', false)" onmousedown="setKey('ArrowDown', true)" onmouseup="setKey('ArrowDown', false)">⬇️</button>
            <button class="d-btn" ontouchstart="setKey('ArrowRight', true)" ontouchend="setKey('ArrowRight', false)" onmousedown="setKey('ArrowRight', true)" onmouseup="setKey('ArrowRight', false)">➡️</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvURE2RdaN4Px1RMRW4-qk_5i5mywrMXiy-2HxHu6pWpMKUPJrr5K5Ylx12t1vOGJQZA/exec';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let myId = '', roomId = '', myScore = 0;
        let myX = Math.random() * 400 + 50, myY = Math.random() * 250 + 50;
        const speed = 3;
        let playersData = {};
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        function joinGame() {
            myId = document.getElementById('usernameInput').value.trim();
            roomId = document.getElementById('roomCodeInput').value.trim();

            if (!myId || roomId.length !== 4) {
                alert('กรุณากรอกชื่อและรหัสห้อง 4 หลักให้ถูกต้อง');
                return;
            }

            document.getElementById('statusMsg').innerText = 'กำลังเชื่อมต่อฐานข้อมูล...';

            setTimeout(() => {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('gameContainer').style.display = 'block';
                if (/Mobi|Android/i.test(navigator.userAgent)) {
                    document.getElementById('mobileControls').style.display = 'grid';
                }
                document.getElementById('barId').innerText = myId;
                document.getElementById('displayRoomId').innerText = roomId;

                setInterval(syncDataWithSheets, 1500); // ซิงค์ข้อมูลทุกๆ 1.5 วินาที
                requestAnimationFrame(gameLoop);
            }, 500);
        }

        function setKey(code, state) { keys[code] = state; }

        function update() {
            let moved = false;
            if (keys.ArrowUp && myY > 20) { myY -= speed; moved = true; }
            if (keys.ArrowDown && myY < canvas.height - 20) { myY += speed; moved = true; }
            if (keys.ArrowLeft && myX > 20) { myX -= speed; moved = true; }
            if (keys.ArrowRight && myX < canvas.width - 20) { myX += speed; moved = true; }
        }

        function syncDataWithSheets() {
            if (!roomId) return;

            // ส่งข้อมูลของเราขึ้น Sheets
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId, playerId: myId, score: myScore, x: Math.round(myX), y: Math.round(myY), status: 'active' })
            }).catch(err => console.log(err));

            // ดึงข้อมูลผู้เล่นทั้งหมดในห้องลงมา
            fetch(`${SCRIPT_URL}?roomId=${roomId}`)
                .then(res => res.json())
                .then(data => {
                    playersData = {};
                    data.forEach(p => {
                        playersData[p.playerId] = { x: p.x, y: p.y, score: p.score };
                    });
                    updateScoreboard();
                })
                .catch(err => console.log(err));
        }

        function updateScoreboard() {
            let list = [];
            for (let id in playersData) {
                list.push({ id, score: playersData[id].score });
            }
            list.sort((a, b) => b.score - a.score);

            let html = '';
            list.forEach(p => {
                let color = (p.id === myId) ? 'color: #4caf50; font-weight:bold;' : 'color: #fff;';
                html += `<li style="${color}"><span>${p.id}</span> <span>⭐ ${p.score}</span></li>`;
            });
            document.getElementById('scoreList').innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ตารางพื้นหลัง
            ctx.strokeStyle = '#222';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            for (let id in playersData) {
                let p = playersData[id];
                ctx.beginPath();
                ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
                ctx.fillStyle = (id === myId) ? '#4caf50' : '#00bcd4';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = '#ffffff';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`${id} (${p.score})`, p.x, p.y - 22);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
